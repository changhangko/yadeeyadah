<section class="bts-intro"><span>BEHIND THE BUILD / HUMAN DIRECTION + AI IMPLEMENTATION</span><h1 data-en="Fast to generate. Deliberate to keep." data-zh="生成可以很快，留下什么需要判断。"></h1><p data-en="I use coding agents to build and iterate. My job is to give them a direction, compare the output with the references and decide what deserves to stay. This page makes that process inspectable." data-zh="开发与迭代由 coding agents 辅助完成。设计方向、参考对照和输出取舍由人判断，过程在这里展开，便于检查。"></p><p data-en="The dated versions below come from this site's actual revision history. Human steering and agent review are labelled separately." data-zh="下面的版本来自这个网站的实际修改记录。设计要求和代理的实现检查分别标注。"></p></section>
<section class="ai-review" data-ai-review aria-label="AI-assisted portfolio case study"></section>
<section class="rules" id="rules"><h2 data-en="Rules used to steer the build" data-zh="用来指导开发的规则"></h2><p data-en="An edited reading of DESIGN_GUARDRAILS.md, the working rules used by coding agents on this repository." data-zh="这里整理了 DESIGN_GUARDRAILS.md 中的工作规则，coding agents 在修改这个仓库时使用这些规则。"></p>
<dl><div><dt data-en="Start with the job" data-zh="先明确这一部分要做什么"></dt><dd data-en="Before adding a section, state its single job. If the job is unclear, the layout is not ready." data-zh="增加一个部分之前，先说清楚它唯一要做的事。目的不清楚，排版就还没准备好。"></dd></div>
<div><dt data-en="Keep the authored identity" data-zh="保留作品自己的性格"></dt><dd data-en="Preserve Genome / Mutation / Decode and the editorial composition. A new component should belong to this portfolio." data-zh="保留 Genome / Mutation / Decode 和现有的编辑式构图。新组件应该属于这个作品集。"></dd></div>
<div><dt data-en="Remove decoration that explains nothing" data-zh="删掉不能解释问题的装饰"></dt><dd data-en="No arbitrary glow, blobs, glass, gradients or repeated card grids. Add a visual only when it improves navigation, comprehension or evidence." data-zh="不随意加入发光、装饰色块、玻璃效果、渐变或重复卡片。一个视觉元素应该帮助导航、理解或展示证据。"></dd></div>
<div><dt data-en="Keep real evidence" data-zh="保留真实证据"></dt><dd data-en="Use actual drawings, photographs, models and process artifacts. Do not invent metrics, outcomes or project credits." data-zh="使用真实图纸、照片、模型和过程资料，不编造指标、成果或项目署名。"></dd></div>
<div><dt data-en="Make the decision legible" data-zh="让人看懂为什么这样改"></dt><dd data-en="Show the reason, what changed and my contribution. Polished screens alone are not enough." data-zh="展示原因、具体改动和参与范围。只有一个漂亮界面，还不足以解释工作。"></dd></div>
<div><dt data-en="Check the actual experience" data-zh="检查实际使用"></dt><dd data-en="Readable text at 100% zoom, keyboard controls, visible states, mobile layouts and reduced motion. A change is unfinished until it works in the browser." data-zh="检查 100% 缩放下的文字、键盘操作、状态、手机布局和减少动态效果。能在浏览器里正常使用，修改才算完成。"></dd></div></dl>
